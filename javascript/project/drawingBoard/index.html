<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whiteBoard</title>
    <style>
        body{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #e1d4d4;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        }
        #control{
            margin: 15px;
            text-align: center;
        }
        button{
            background-color: coral;
            font-size: 16px;
            padding: 10px,12px;
            color: rgb(239, 237, 237);
            border: none;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 4px;

        }
        button:hover{
            background-color: rgb(196,68,76);
        }
        canvas{
            border: 3px solid whitesmoke;
            background-color: 434343;
            border-radius: 9px;
            cursor: crosshair;
            color : rgb(216, 216, 11);
            transition:  background-color 0.3s,ease;
        }


    </style>
</head>
<body>
<div id="control" >
    <button id="clearbtn">Clear Board</button>
    <p id="para"><strong>Tip</strong>right click change the brush
    |Double click to change bg color</p>
    <canvas id="paintcanvas" width="400px" height="500px"></canvas>

    <script src="app.js"></script>
</div>
</body>
</html>
