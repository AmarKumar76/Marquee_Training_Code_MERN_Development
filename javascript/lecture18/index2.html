<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .box{
      width: 200px;
      height: 200px;
      background: gray;
      margin-bottom: 20px;
    }

    .red{
      background: red;
    }

    .circle{
      border-radius: 50%;
    }

    .border{
      border: 5px solid black;
    }

  </style>
</head>
<body>
  <div id="box" class="box"></div>
  <button class="add">Add red</button>
  <button class="remove">Remove red</button>
  <button id="toggle">Toggle Circle</button>
  <button id="replace">Replace red with border</button>
  <button id="contains">Contains red</button>

  <script src="app2.js"></script>
  </body>
</html>
