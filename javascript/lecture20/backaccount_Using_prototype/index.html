<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Apna Bank</h2>
    <form id="accountForm"> 
        <input type="text" id="customerName" placeholder="Customer Name"> 
        <input type="text" id="balance" placeholder="Initial Balance">
         <button>Create Account</button> 
    </form>
    <form id="depositForm">
         <input type="number" id="depositAmount" placeholder="enter amount">
         <input type="number" id="depositAccNum" placeholder="enter account number">
          <button>deposit amount</button> 
    </form>
    <form id="withdrawForm">
         <input type="number" id="withdrawAmount" placeholder="enter amount ">
         <input type="number" id="withdrawAccNum" placeholder="enter account number">
          <button>withdraw amount</button> 
    </form>
    <script src="app.js"></script>
</body>

</html>
