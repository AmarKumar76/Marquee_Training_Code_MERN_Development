<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events Demo</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #myBtn{
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #heading{
            margin: 20px;
            color: black;
        }

        #box{
            width: 300px;
            height: 250px;
            background-color: lightblue;
            border: 3px solid black;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            user-select: none;
        }
    </style>
</head>
<body>

    <h1 id="heading">Mouse Events Demo</h1>

    <button id="myBtn">Click Me</button>

    <div id="box">
        Move your mouse here
    </div>

    <script src="app.js"></script>

</body>
</html>
